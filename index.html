<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <span id="session-label"></span>
  </header>

  <main>
    <div id="login-panel" class="panel">
      <h2>Teacher login</h2>
      <div id="login-error" class="error"></div>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="teacher" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="sms123" autocomplete="current-password">
      <button id="login-btn">Log in</button>
    </div>

    <div id="app" class="hidden">
      <!-- SMS-2: add student form goes here -->
      <!-- SMS-6: search box goes here -->
      <div class="panel">
        <h2>Students</h2>
        <table>
          <thead>
            <tr><th>Roll</th><th>Name</th><th>Class</th><th>Marks</th></tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
        <div id="empty-state" class="empty hidden">No students yet.</div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
