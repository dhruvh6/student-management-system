<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <span id="session-label"></span>
  </header>

  <main>
    <div id="login-panel" class="panel">
      <h2>Teacher login</h2>
      <div id="login-error" class="error"></div>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="teacher" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="sms123" autocomplete="current-password">
      <button id="login-btn">Log in</button>
    </div>

    <div id="app" class="hidden">
      <div class="panel">
        <h2>Add a student</h2>
        <div id="add-error" class="error"></div>
        <div class="row">
          <div><label for="add-roll">Roll number</label><input id="add-roll" type="text"></div>
          <div><label for="add-name">Name</label><input id="add-name" type="text"></div>
          <div><label for="add-cls">Class</label><input id="add-cls" type="text"></div>
          <div><label for="add-marks">Marks</label><input id="add-marks" type="number"></div>
        </div>
        <button id="add-btn">Add student</button>
      </div>
      <div class="panel">
        <label for="search-box">Search by name or roll number</label>
        <input id="search-box" type="text" placeholder="Type to filter">
      </div>
      <div class="panel">
        <h2>Students</h2>
        <table>
          <thead>
            <tr><th>Roll</th><th>Name</th><th>Class</th><th>Marks</th><th>Actions</th></tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
        <div id="empty-state" class="empty hidden">No students match.</div>
      </div>

      <div class="panel">
        <h2>Class report</h2>
        <table>
          <thead>
            <tr><th>Class</th><th>Students</th><th>Average</th><th>Highest</th><th>Lowest</th><th>Passed</th></tr>
          </thead>
          <tbody id="report-rows"></tbody>
        </table>
        <div id="report-empty" class="empty hidden">No students yet.</div>
        <p id="report-overall"></p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
